name: HORRIFY cinema geographic import
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/horror-radar-v14
      - name: Install osmium and geometry parser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y osmium-tool
          python -m pip install --user shapely==2.1.2
      - name: Download Italy OpenStreetMap extract
        run: curl --fail --location --retry 3 --connect-timeout 30 -o italy.osm.pbf https://download.geofabrik.de/europe/italy-latest.osm.pbf
      - name: Filter cinemas and export GeoJSON sequence
        run: |
          osmium tags-filter italy.osm.pbf nwr/amenity=cinema -o cinemas.osm.pbf --overwrite
          osmium export cinemas.osm.pbf -f geojsonseq -o cinemas.geojsonseq --overwrite
      - name: Import to Supabase
        env:
          SUPABASE_URL: ${{ secrets.HORRIFY_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.HORRIFY_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_SERVICE_ROLE_KEY"
          python scripts/import_radar_cinemas.py cinemas.geojsonseq
